name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: patient_queue_testing
          POSTGRES_USER: patient_queue
          POSTGRES_PASSWORD: patient_queue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patient_queue -d patient_queue_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: patient_queue_testing
      DB_USERNAME: patient_queue
      DB_PASSWORD: patient_queue
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, redis, intl, zip, bcmath
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Check formatting (Pint)
        run: composer lint:check

      - name: Static analysis (Larastan)
        run: composer types:check

      - name: Run migrations and seeders against PostgreSQL
        run: php artisan migrate:fresh --seed --force

      - name: Run test suite (Pest)
        run: php artisan test --compact
